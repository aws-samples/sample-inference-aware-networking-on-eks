# Envoy Gateway values for the "Envoy Gateway plus Envoy AI Gateway" stack
# (design section 4.1). This is the base AI Gateway integration values merged with
# the inference-pool addon (backendResources: InferencePool v1), so Envoy Gateway
# accepts an HTTPRoute backendRef of kind InferencePool and fine-tunes the xDS the
# AI Gateway controller extension server produces.
# Source: envoyproxy/ai-gateway manifests/envoy-gateway-values.yaml +
#         examples/inference-pool/envoy-gateway-values-addon.yaml (v1.0.0).
# The extensionManager.service points at the AI Gateway controller, which MUST be
# installed first (namespace envoy-ai-gateway-system) or Envoy Gateway xDS fails.
config:
  envoyGateway:
    gateway:
      controllerName: gateway.envoyproxy.io/gatewayclass-controller
    logging:
      level:
        default: info
    provider:
      type: Kubernetes
    extensionApis:
      enableEnvoyPatchPolicy: true
      enableBackend: true
    extensionManager:
      hooks:
        xdsTranslator:
          translation:
            listener:
              includeAll: true
            route:
              includeAll: true
            cluster:
              includeAll: true
            secret:
              includeAll: true
          post:
            - Translation
            - Cluster
            - Route
      service:
        fqdn:
          hostname: ai-gateway-controller.envoy-ai-gateway-system.svc.cluster.local
          port: 1063
      # Register InferencePool as a routable backend kind.
      backendResources:
        - group: inference.networking.k8s.io
          kind: InferencePool
          version: v1
