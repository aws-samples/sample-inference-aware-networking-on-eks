# vLLM batch Deployment and Service. Identical to interactive except the tier.
# INVARIANT 1: labels match the batch InferencePool selector.
# INVARIANT 5: toleration matches the batch NodePool taint.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm-llama3-batch
  namespace: inference
  # spike-safety-net: see manifests/02-serving/vllm-interactive.yaml.
  labels: { app: vllm-llama3, tier: batch, spike-safety-net: managed }
spec:
  # READER SIZE: 1. Reduced from 4 on 2026-08-07, same reasoning as the interactive tier.
  #
  # test-tier-isolation needs the batch tier PRESENT and saturable, not large: it floods batch and
  # asserts interactive p95 time to first token holds. One batch replica is saturable by the flood
  # the test already sends. The published load-test suite used 4 (KEDA min 4; min 0 only for the
  # LT-5 scale-to-zero check) and needs them back to reproduce its numbers.
  replicas: 1
  # Recreate (not RollingUpdate): a GPU pod's rollout surge would request a second
  # GPU and drive Karpenter to a needlessly large node. One pod at a time.
  strategy:
    type: Recreate
  selector:
    matchLabels: { app: vllm-llama3, tier: batch }
  template:
    metadata:
      labels: { app: vllm-llama3, tier: batch }
    spec:
      serviceAccountName: vllm
      nodeSelector:
        tier: batch          # NOT pinned to an instance-family: let the diversified
                             # batch NodePool (g6e/g6/g5 Spot) choose whatever has capacity
      tolerations:
        - { key: nvidia.com/gpu, operator: Equal, value: "true", effect: NoSchedule }
      containers:
        - name: vllm
          image: public.ecr.aws/deep-learning-containers/vllm:0.24.0-gpu-py312-cu130-ubuntu22.04-ec2-v1.3-soci   # versions.yaml choices.vllm_image
          args:
            # STANDARD TIER, batch lane, spec-002. Same model as interactive: the same-model-per-class
            # rule means the class is defined by the model, not by the lane it is served in.
            - --model=Qwen/Qwen3-8B
            - --revision=b968826d9c46dd6066d109eabc6255188de91218
            - --enable-prefix-caching
            # MEASURED on this exact GPU by pre-check B: num_gpu_blocks 1504 x block_size 16 =
            # C = 24,064 tokens, 21.7 percent less than Llama-3.1-8B's 30,736 on the same L4.
            # Every overflow ratio in the ramp experiment is defined against 24,064.
            - --max-model-len=8192
            - --gpu-memory-utilization=0.9
            # THINKING FORCED OFF, server-side (spec-002 4.2; ruling 2026-09-22). One committed template for
            # the whole Qwen3 family on every tier, so mode cannot drift per tier. INV20 holds this path
            # and the ConfigMap bytes in agreement.
            - --chat-template=/etc/vllm/chat-templates/qwen3-nonthinking.jinja
            - --port=8000
          env:
            - name: HUGGING_FACE_HUB_TOKEN
              valueFrom:
                secretKeyRef: { name: hf-token, key: token, optional: true }
          volumeMounts:
            - { name: chat-template, mountPath: /etc/vllm/chat-templates, readOnly: true }
          ports:
            - { name: http, containerPort: 8000 }
          resources:
            limits: { nvidia.com/gpu: 1 }
          startupProbe:
            httpGet: { path: /health, port: 8000 }
            failureThreshold: 60
            periodSeconds: 10
          readinessProbe:
            httpGet: { path: /health, port: 8000 }
            periodSeconds: 5
      volumes:
        - name: chat-template
          configMap: { name: chat-template-qwen3-nonthinking }   # manifests/02-serving/chat-template-qwen3-nonthinking.yaml
---
apiVersion: v1
kind: Service
metadata:
  name: vllm-llama3-batch
  namespace: inference
spec:
  selector: { app: vllm-llama3, tier: batch }
  ports:
    - { name: http, port: 8000, targetPort: 8000 }
