# KEDA ScaledObject, batch tier. Gradual scale-out, aggressive scale-in.
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: vllm-llama3-batch
  namespace: inference
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: vllm-llama3-batch
  # READER SIZE: 1. Reduced from 4 on 2026-08-08, AFTER the walkthrough run proved the
  # Deployment-only reduction was incomplete.
  #
  # KEDA OWNS THE REPLICA COUNT once a ScaledObject exists. The serving Deployments were reduced to
  # replicas: 1 for reader size, and this floor silently overrode them: `make observability-scalers`
  # is the LAST step of the walkthrough, and applying it scaled both tiers back to 4, which made
  # Karpenter provision a fleet. Peak concurrency went to ELEVEN instances against a projection of
  # two, including two g6.12xlarge nobody asked for.
  #
  # THE SHAPE, for the third time in one batch: a class fix applied to one member. Reader size was
  # applied to the Deployments and not to the autoscalers that override them.
  #
  # The publication load-test suite needs 4 here. Raise it deliberately for those runs, the same way
  # the Deployment replicas are raised.
  minReplicaCount: 1
                               # cache-aware routing has >=2 backends to place across. See LT-8:
                               # this ScaledObject MUST be suspended (paused-replicas) during LT-8
                               # so N cannot drift with the admission arm and bias the 2x2.
  maxReplicaCount: 2           # reader size; the load-test suite raises this with minReplicaCount
  cooldownPeriod: 60
  advanced:
    horizontalPodAutoscalerConfig:
      behavior:
        scaleUp:   { stabilizationWindowSeconds: 60 }
        scaleDown: { stabilizationWindowSeconds: 30 }
  triggers:
    - type: prometheus
      metadata:
        serverAddress: http://prometheus.monitoring:9090
        query: sum(vllm:num_requests_waiting{tier="batch"})
        threshold: "20"
