<svg width="100%" viewBox="0 0 680 592" role="img" xmlns="http://www.w3.org/2000/svg" style=""><title style="fill:rgb(0, 0, 0);stroke:none;color:rgb(11, 11, 11);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:-apple-system, &quot;system-ui&quot;, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto">Inference-aware serving reference architecture on Amazon EKS</title><desc style="fill:rgb(0, 0, 0);stroke:none;color:rgb(11, 11, 11);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:-apple-system, &quot;system-ui&quot;, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto">Interactive clients call the inference gateway directly. Batch clients submit through an async front door of SQS, DynamoDB and workers. Both paths reach the same Envoy gateway, which routes by objective header and consults per-pool endpoint pickers that select a GPU or Inferentia replica. Serving pods run on Karpenter node pools, one per tier.</desc>
