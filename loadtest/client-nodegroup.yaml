# Dedicated client node group for the load generators (Phase 1.3). Keeps Locust off
# the serving path so the numbers are meaningful. Follows the AWS HyperPod benchmark
# shape: roughly one c5.12xlarge-class client per 100 concurrent request streams,
# client and server isolated. Apply with:
#   eksctl create nodegroup -f loadtest/client-nodegroup.yaml
# Size desiredCapacity to ceil(peak_concurrency / 100). Delete after the suite:
#   eksctl delete nodegroup --cluster inference-aware-eks --name loadgen
apiVersion: eksctl.io/v1alpha5
kind: ClusterConfig
metadata:
  name: inference-aware-eks
  region: us-west-2
managedNodeGroups:
  - name: loadgen
    instanceType: c5.12xlarge      # 48 vCPU, high network; client CPU/net headroom
    desiredCapacity: 1             # raise to ceil(peak concurrent streams / 100)
    minSize: 0
    maxSize: 4
    labels: { role: loadgen }
    taints:
      - key: role
        value: loadgen
        effect: NoSchedule          # only the Locust pods (which tolerate this) land here
    volumeSize: 100
