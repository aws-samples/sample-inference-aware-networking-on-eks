<svg xmlns="http://www.w3.org/2000/svg" width="640" height="320" font-family="sans-serif">
<text x="320.0" y="22" text-anchor="middle" font-size="14" font-weight="bold">Prefix-cache hit rate, 48 prefixes (EPP vs round-robin)</text>
<text x="320.0" y="38" text-anchor="middle" font-size="10.5" fill="#666">NVIDIA: cache (195k) HOLDS the ~100k working set; gap is cold-start replication (RR warms each prefix on all 4 replicas)</text>
<text x="320.0" y="51" text-anchor="middle" font-size="10.5" fill="#666">Neuron: cache (16k) OVERFLOWED by the 58k working set; gap is eviction</text>
