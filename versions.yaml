# the license wait; identical Llama-3.1-8B-Instruct weights.
loadtest_model: "NousResearch/Meta-Llama-3.1-8B-Instruct"
loadtest_model_revision: "d10aef7999a2b5ba950ab3974312feeedbfe0b77"

# --- Spike B Neuron serving config (confirmed on the running pod 2026-07-23, Gate 1) ---
# Recorded from the live pod: cache_config_info + launch args on the AWS Neuron fork.
spike_b_neuron:
  model: "TinyLlama/TinyLlama-1.1B-Chat-v1.0"   # ungated Llama-architecture, short AOT compile
  dlc_image: "public.ecr.aws/neuron/pytorch-inference-vllm-neuronx:0.16.0-neuronx-py312-sdk2.31.0-ubuntu24.04"
  instance_type: "inf2.24xlarge"                # SPIKE-B pin: one 6-Neuron-device node hosts 2 replicas for the Phase 3 routing test (test-only nodeSelector, restored at teardown)
  tensor_parallel_size: 2                        # 2 NeuronCores = 1 Neuron device
  max_model_len: 2048
  max_num_seqs: 4
  # Prefix-caching-OFF (contiguous) baseline, confirmed from vllm:cache_config_info:
  #   enable_prefix_caching=False, block_size=2048 (= max_model_len), num_gpu_blocks=5,
  #   num_gpu_blocks_override=5, _neuron_null_block_adjusted=True (plugin adjusted 4 -> 5,
  #   one null block). Phase 2 toggles enable_prefix_caching to study the KV-metric semantics.
  metric_names_confirmed:                        # present on the fork under UPSTREAM names (Phase 1.4)
    - vllm:kv_cache_usage_perc
    - vllm:num_preemptions_total
    - vllm:num_requests_running
    - vllm:num_requests_waiting
    - vllm:prefix_cache_hits_total
    - vllm:prefix_cache_queries_total
  verified_on: "2026-07-23"

# --- spec-002 Qwen3 refresh (ruling 2026-09-20, section 4.1) ---
# REVISIONS ARE PINNED AS HASHES, NOT NAMES. A tag that moves silently reproduces nothing, and the
# model-facts registry already records `revision_pinned_in_manifest: false` as a known gap for both
# incumbent models. The serving manifests close that gap in the same change that adopts these pins.
# Read from the Hugging Face model API 2026-09-20.
qwen3_refresh:
  economy:
    model: "Qwen/Qwen3-1.7B"
    revision: "70d244cc86ccca08cf5af4e1e306ecf908b1ad5e"
    # CORRECTED 2026-09-24. This read "AWS Inferentia2 (inf2)" until today, which was true when
    # pre-check A passed (compile and serve succeeded, 2026-09-20) and FALSE from 2026-09-23, when
    # experiment 2 stage 1 found period-4 multi-slot degeneracy with SILENT corruption on the
    # legacy Neuron line and the standing L4 branch fired. The manifests moved that day; this field
    # did not. The model did not change, only the hardware: single-variable, as the branch required.
    hardware: "NVIDIA L4 (g6)"
    hardware_history: >-
      Inferentia2 until 2026-09-23. Moved to L4 by the pre-ruled FAIL branch of spec-002 section 5
      after spikes/experiment-2-neuron-stage1-2026-09-23/RESULT.md. The Neuron arm closes as
      characterization, carrying two findings (KV-metric semantics, period-4 silent corruption).
      Measured consequence: the Neuron path offered 4 sequence slots and was usable at 1, where L4
      measured 149,376 tokens of KV and 72.94x concurrency at the class contract of 2,048 tokens.
    verified_on: "2026-09-24"
  standard:
    model: "Qwen/Qwen3-8B"
    revision: "b968826d9c46dd6066d109eabc6255188de91218"
    hardware: "NVIDIA L40S (g6e, interactive lane) and NVIDIA L4 (g6, batch lane)"
  premium:
    model: "Qwen/Qwen3-32B-AWQ"
    revision: "0499c3ac83fdef8810b907a23894ba91e95eddd8"
    hardware: "NVIDIA L40S (g6e) ONLY"
    hardware_note: >-
      L40S-only is forced by arithmetic, not preference: 19.33 GB of AWQ weights leave about 4,000
      tokens of KV on a 24 GB L4, which cannot host a prefix-caching experiment. The
      same-model-per-class rule then makes 32B unusable as the standard class.

  # THE NEURON PIN, and its cost stated plainly rather than buried.
  # NxD Inference dropped Trn1/Inf2 at Neuron 2.29.0 (2026-04-09) and AWS's instruction is to pin to
  # 2.28 for Inf2. NxD Inference is now in maintenance mode with no new feature releases planned.
  vllm_neuron_dlc_image_2_28: "public.ecr.aws/neuron/pytorch-inference-vllm-neuronx:0.13.0-neuronx-py312-sdk2.28.0-ubuntu24.04"
  neuron_pin_cost: >-
    The 2.28 image carries vLLM 0.13.0 against 0.16.0 in the sdk2.31.0 image above, so this pin
    freezes the Neuron-side vLLM THREE MINOR VERSIONS BACK, not only the SDK. Proven serviceable:
    pre-check A compiled Qwen3-1.7B in 10.8 min with zero restarts and served HTTP 200 in 2.52 s.
  neuron_pin_reactivation_condition: >-
    Revisit when EITHER Trn2 becomes reachable in-region at a size this workload can use, OR AWS
    resolves the contradiction between its What's New page ("NxD Inference no longer supports
    Trn1/Inf2") and the versioned 2.29.0 release notes, which scope the same change narrowly to NKI
    kernels. Recorded so the pin is revisited rather than inherited.

  # THE GPU PIN DOES NOT MOVE. Qwen3 requires only vLLM >= 0.8.5 and choices.vllm_image is 0.24.0,
  # so no engine change is needed. That is what keeps the promotion-and-cancellation result on the
  # version it was actually measured on.
  gpu_vllm_pin_unchanged: "0.24.0, see choices.vllm_image"

  # MEASURED, not derived. Pre-check B, 2026-09-21, g6.xlarge on-demand.
  measured_l4_kv_cache:
    num_gpu_blocks: 1504
    block_size: 16
    tokens: 24064
    note: >-
      Pre-registered prediction was ~1,560 blocks / ~25,018 tokens, so the derivation was 3.8 percent
      high. Every overflow ratio in the ramp experiment uses C = 24,064, NOT 25,000. The L40S figure
      (~171,000) is still DERIVED and must be read from num_gpu_blocks during experiment 3.
  verified_on: "2026-09-21"

verified_on: "2026-08-03"     # RE-VERIFIED at the rebuild against upstream release APIs and the ECR
                              # registry. Moved with the rebuild: Envoy Gateway v1.8.2 to v1.8.3, KEDA
                              # v2.20.1 to v2.20.2. Held: vLLM DLC 0.24.0 (frozen through Phase 3, moving it
                              # invalidates A15 and both halves of 12.1), kube-prometheus-stack 87.17.0.
                              # Model + revision were verified against the HF API on 2026-07-21.
verified_by: "version research vs GitHub Releases API, in-repo Chart.yaml/values.yaml at release tag, ECR Public registry tags, AWS EKS docs"

