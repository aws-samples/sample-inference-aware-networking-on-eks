# Submit API (producer). Fronts the SQS queue: computes a deterministic job_id and
# enqueues. Runs the same image as the worker with args overridden to submit_api.py.
# Auth via Pod Identity (submit-api SA -> inference-submit-api role: SQS SendMessage, DynamoDB GetItem).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: submit-api
  namespace: inference
spec:
  replicas: 1
  selector:
    matchLabels: { app: submit-api }
  template:
    metadata:
      labels: { app: submit-api }
    spec:
      serviceAccountName: submit-api
      securityContext:
        # Non-root, high UID, default seccomp: the CPU services need none of root's powers.
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile: { type: RuntimeDefault }
      volumes:
        - { name: tmp, emptyDir: {} }
      containers:
        - name: submit-api
          # v6: the submit API stamps a correlation id (the deterministic job_id) and
          # submitted_at into the enqueued message, so the job is traceable end to end.
          image: 111122223333.dkr.ecr.us-west-2.amazonaws.com/inference-async-worker:sha-62d6b6e13814
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
          resources:
            requests: { cpu: "100m", memory: "128Mi" }
            limits:   { cpu: "500m", memory: "512Mi" }
          # LIVENESS IS A TCP PROBE, readiness stays HTTP (release candidate 7). The server caps its
          # connections and answers one past the cap with 503 from its accept loop. An HTTP liveness
          # probe would read that 503 as a dead process, so a host holding every connection could make
          # the kubelet restart the pod and drop its in-flight work. The TCP connect still succeeds
          # then, and still fails once the process stops accepting. Readiness failing under that
          # load is correct: a saturated replica leaves rotation without being restarted.
          livenessProbe:
            tcpSocket: { port: 8080 }
            initialDelaySeconds: 10
            periodSeconds: 20
          args: ["submit_api.py"]
          env:
            - { name: HOME, value: /tmp }   # writable home on a read-only root
            # SQS_QUEUE_URL is DISCOVERED, not hardcoded. THE CLASS, not a one-off: this was
            # committed as ".../111122223333/inference", the SANITIZATION PLACEHOLDER ACCOUNT, so
            # it could never have run against a real queue. phase3b found and fixed it on
            # async-worker/deployment.yaml on 2026-08-05 and THE SIBLINGS WERE MISSED, because the
            # fix was applied to the instance rather than to the class. The walkthrough run of
            # 2026-08-08 hit it again here.
            #
            # THE ERROR IS MISLEADING, which is why it costs a debugging detour every time:
            #   InvalidAddress: The address https://sqs.us-west-2.amazonaws.com/ is not valid
            # botocore reports the HOST, not the URL with the wrong account, so "111122223333"
            # appears nowhere in the message and the reader looks at IAM before the manifest.
            - name: SQS_QUEUE_URL
              valueFrom:
                configMapKeyRef:
                  name: async-endpoints
                  key: sqs_queue_url
            - { name: AWS_REGION, value: "us-west-2" }
            - { name: AWS_DEFAULT_REGION, value: "us-west-2" }
            - { name: PORT, value: "8080" }
          ports:
            - { name: http, containerPort: 8080 }
          readinessProbe:
            httpGet: { path: /healthz, port: 8080 }
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: submit-api
  namespace: inference
spec:
  selector: { app: submit-api }
  ports:
    - { name: http, port: 8080, targetPort: 8080 }
